name: Release CI/CD (Multi-Platform Portable & Installers)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.6.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browsers
  MAVEN_OPTS: "-Daether.connector.http.retryHandler.serviceUnavailable=403,429,503 -Daether.connector.http.retryHandler.count=5 -Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true"

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 26 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify JDK & jpackage Tooling
        run: jpackage --version

      - name: Install Linux Headless Display Server (Xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fakeroot

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          echo "C:\Program Files\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Run Automated Test Suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum mvn test

      - name: Run Automated Test Suite (macOS)
        if: runner.os == 'macOS'
        run: mvn test

      - name: Run Automated Test Suite (Windows)
        if: runner.os == 'Windows'
        run: mvn test

      - name: Build Portable Bundle (Unix - macOS / Ubuntu)
        if: runner.os != 'Windows'
        run: bash scripts/build-portable.sh

      - name: Build Portable Bundle (Windows)
        if: runner.os == 'Windows'
        run: scripts\build-portable.bat

      - name: Build Setup Installer (Windows)
        if: runner.os == 'Windows'
        run: scripts\build-installer.bat

      - name: Build DMG Installer (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/build-installer.sh

      - name: Build Debian Installer (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-installer-linux.sh

      - name: Upload Platform Package Artifacts (Portable + Installers)
        uses: actions/upload-artifact@v4
        with:
          name: TestStudio-${{ runner.os }}
          path: |
            dist/TestStudio-*.zip
            dist/TestStudio-*-Setup.exe
            dist/TestStudio-*.dmg
            dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: TestStudio-*
          merge-multiple: true

      - name: List Release Artifacts
        run: ls -la artifacts/

      - name: Determine Release Tag and Title
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TITLE="${{ github.event.release.name }}"
            if [ -z "$TITLE" ]; then
              TITLE="Test Studio $TAG"
            fi
          elif [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
            TITLE="Test Studio $TAG"
          else
            TAG="${{ github.ref_name }}"
            TITLE="Test Studio $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Extract Release Notes for Current Version
        shell: bash
        run: |
          mkdir -p dist
          python3 scripts/extract-release-notes.py "${{ steps.release_info.outputs.tag }}" dist/CURRENT_RELEASE_NOTES.md

      - name: Publish GitHub Release & Attach Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body_path: dist/CURRENT_RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.deb
          fail_on_unmatched_files: false
          draft: false
          prerelease: false

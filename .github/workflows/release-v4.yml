name: Release v4 (Portable ZIP + Setup)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-v4-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  QT_API: pyside6
  QT_QPA_PLATFORM: offscreen
  QT_OPENGL: software
  LIBGL_ALWAYS_SOFTWARE: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            shell: bash
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup uv / Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12:-}" ]]; then
            echo "MACOS_CERT_P12 not set — macOS build will be unsigned" >&2
            exit 0
          fi
          # Ephemeral keychain so the certificate never persists on the runner.
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          printf '%s' "${MACOS_CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN_PATH}" \
            -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          # Required on macOS 11+: without this, codesign cannot use the key.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          # Keep the pre-existing user keychains and prepend ours.
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 — each keychain must be a separate argument
          security list-keychains -d user -s "${KEYCHAIN_PATH}" ${EXISTING_KEYCHAINS}
          rm -f "${RUNNER_TEMP}/cert.p12"
          security find-identity -v -p codesigning

      - name: Install Qt headless runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb1 libxcb-cursor0 libfontconfig1 libfreetype6 \
            fakeroot dpkg-dev zip

      - name: Sync project (no Playwright browser install)
        run: uv sync --extra build --extra dev

      - name: Unit tests (packaging helpers)
        run: uv run pytest tests/unit/test_runtime_paths.py tests/unit/test_chromium_bootstrap.py tests/unit/test_app_metadata.py -q --tb=short

      - name: Package portable (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/*.sh
          bash scripts/package_app.sh

      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # package_app.ps1 signs onedir (when secrets present) THEN creates ZIP
          ./scripts/package_app.ps1

      - name: Build Windows Setup (Inno)
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          choco install innosetup --yes
          ./scripts/build-installer-win.ps1

      - name: Verify Authenticode signatures (Windows)
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:WINDOWS_CERT_PFX) {
            Write-Warning "WINDOWS_CERT_PFX not set — no Authenticode to verify"
            exit 0
          }
          $targets = @(
            Get-ChildItem dist -Filter "*.exe" -File -ErrorAction SilentlyContinue
          ) + @(
            Get-ChildItem (Join-Path "dist" "AIQATestStudio") -Filter "*.exe" -File -Recurse -ErrorAction SilentlyContinue
          )
          if ($targets.Count -eq 0) { throw "no executables found to verify" }
          foreach ($target in $targets) {
            $status = (Get-AuthenticodeSignature -LiteralPath $target.FullName).Status
            if ($status -ne "Valid") {
              throw "signature not valid: $($target.FullName) -> $status"
            }
          }
          Write-Host "Authenticode verified for $($targets.Count) file(s)"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: bash scripts/build-dmg.sh

      - name: Verify macOS signature + Gatekeeper
        if: runner.os == 'macOS'
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CODESIGN_IDENTITY:-}" ]]; then
            echo "MACOS_CODESIGN_IDENTITY not set — nothing signed to verify" >&2
            exit 0
          fi
          DMG=$(ls dist/AIQATestStudio-*-macos-*.dmg | head -n1)
          codesign --verify --verbose=2 "${DMG}"
          if [[ -n "${MACOS_NOTARY_APPLE_ID:-}" || -n "${MACOS_NOTARY_PROFILE:-}" ]]; then
            spctl --assess --type open --context context:primary-signature -vv "${DMG}"
          fi

      - name: Forget macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          if [[ -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi

      - name: Build Linux deb
        if: runner.os == 'Linux'
        run: bash scripts/build-deb.sh

      - name: Smoke-check portable binary
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          ZIP=$(ls dist/AIQATestStudio-*.zip | head -n1)
          STAGE=$(mktemp -d)
          unzip -q "$ZIP" -d "$STAGE"
          if [[ -d "$STAGE"/AIQATestStudio.app ]]; then
            "$STAGE"/AIQATestStudio.app/Contents/MacOS/AIQATestStudio --smoke-check
          else
            "$STAGE"/AIQATestStudio/AIQATestStudio --smoke-check
          fi

      - name: Smoke-check portable binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $zip = Get-ChildItem dist -Filter AIQATestStudio-*.zip | Select-Object -First 1
          $stage = Join-Path $env:RUNNER_TEMP "smoke"
          Expand-Archive $zip.FullName -DestinationPath $stage -Force
          & (Join-Path $stage "AIQATestStudio\AIQATestStudio.exe") --smoke-check

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIQATestStudio-${{ runner.os }}
          path: |
            dist/AIQATestStudio-*.zip
            dist/AIQATestStudio-*-Setup.exe
            dist/AIQATestStudio-*.dmg
            dist/AIQATestStudio-*.deb
            dist/metadata.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find release-assets -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name 'metadata.json' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - name: Setup uv (signing)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Checksums over every artifact
        run: |
          cd dist
          rm -f SHA256SUMS SHA256SUMS.asc
          FILES=(*.zip *-Setup.exe *.dmg *.deb)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          sha256sum "${FILES[@]}" > SHA256SUMS
          uv run --with pysequoia python "$GITHUB_WORKSPACE/scripts/release_sign.py" "$PWD"
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

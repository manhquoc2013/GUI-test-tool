# LEGACY Java/jpackage pipeline — disabled.
# v4 ships via `.github/workflows/release-v4.yml` (PyInstaller).
# Kept for manual archaeology only; do not re-enable on tag push.
name: Release CI/CD (Legacy Java — disabled)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE-LEGACY-JAVA to run (otherwise no-op)"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  disabled:
    name: Legacy Java release disabled
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless explicitly confirmed
        run: |
          if [ "${{ inputs.confirm }}" != "ENABLE-LEGACY-JAVA" ]; then
            echo "Legacy Java/jpackage release is retired. Use release-v4.yml."
            exit 0
          fi
          echo "Confirm set but pom.xml / Java tree are gone — aborting."
          exit 1

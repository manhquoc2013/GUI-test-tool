name: Release Portable
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browsers

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '26', distribution: 'temurin' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Ensure jpackage available
        run: jpackage --version
      - name: Portable (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/build-portable.sh
      - name: Portable (Win)
        if: runner.os == 'Windows'
        run: scripts/build-portable.bat
      - uses: actions/upload-artifact@v4
        with:
          name: PlaywrightAutomationStudio-${{ runner.os }}
          path: dist/PlaywrightAutomationStudio-*.zip

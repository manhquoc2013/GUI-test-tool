name: python-ci

on:
  push:
  pull_request:

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_API: pyside6
  QT_QPA_PLATFORM: offscreen
  QT_OPENGL: software

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install Qt headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libfontconfig1 \
            libfreetype6

      - name: Sync
        run: uv sync --extra dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: uv run ruff check src tests

      - name: Types
        run: uv run mypy src

      - name: Test
        run: xvfb-run --auto-servernum uv run pytest -q

  build:
    # Package artifacts only on version tags (e.g. v4.2.0).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Sync build extras
        run: uv sync --extra build

      - name: Build wheel / sdist
        run: uv build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

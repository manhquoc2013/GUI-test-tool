name: Build Offline Installers (DMG & Setup EXE)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version tag (e.g. v2.0.0)'
        required: false
        default: '2.0.0'

permissions:
  contents: write

jobs:
  build-macos-installer:
    name: Build macOS DMG Installer
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 26 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build macOS DMG Installer
        run: |
          chmod +x scripts/build-installer.sh
          ./scripts/build-installer.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestStudio-macOS-DMG
          path: dist/*.dmg
          if-no-files-found: error

  build-windows-installer:
    name: Build Windows Setup Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 26 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Build Windows Setup EXE
        shell: cmd
        run: call scripts\build-installer.bat

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestStudio-Windows-Setup
          path: dist/*Setup*.exe
          if-no-files-found: error

